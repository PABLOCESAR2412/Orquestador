name: Comprobaciones
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  servidor:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap python3
      - run: |
          bash -n deploy/actualizar.sh
          bash -n deploy/instalar-politica-codex.sh
          bash -n deploy/configurar-actualizador.sh
          bash -n deploy/verificar-agentes.sh
          bash -n deploy/instalar-rtk.sh
          bash -c 'dir_mode=755; (( (8#$dir_mode & 022) == 0 )); dir_mode=775; (( (8#$dir_mode & 022) != 0 ))'
      - name: RTK verificado para pruebas de aislamiento
        run: |
          mkdir -p "$RUNNER_TEMP/telo-rtk"
          HOME="$RUNNER_TEMP/telo-rtk" bash deploy/instalar-rtk.sh
          echo "TELO_TEST_RTK_BINARY=$RUNNER_TEMP/telo-rtk/.local/bin/rtk" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bun run typecheck
        working-directory: server
      # Una sola ejecución detecta contaminación entre suites que el aislamiento por archivo ocultaba.
      - run: bun test --timeout 60000 --max-concurrency=1
        working-directory: server
      - run: bun run test:worker
        working-directory: server
  interfaz:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun test tests
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: bun run test:ui
        working-directory: web
        env:
          TELO_UI_VIDEO_FIXTURE: tests/fixtures/referencia.mp4
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bun tests/html-preview.mjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-ui
          path: web/scratch/capturas-ci/
          if-no-files-found: ignore
